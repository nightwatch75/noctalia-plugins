# nnotes — quick notes on the bar: a floating panel with a list of notes.

id = "nightwatch75/nnotes"
name = "nnotes"
version = "1.0.0"
plugin_api = 24
author = "nightwatch75"
license = "MIT"
dependencies = ["xdg-open", "grep"]
tags = ["bar", "panel", "productivity"]
icon = "notes"
description = "Quick notes on the bar: pin, sort, search and autosave a folder of notes."

[[setting]]
key = "notes_folder"
type = "folder"
label_key = "settings.notes_folder.label"
description_key = "settings.notes_folder.description"

[[setting]]
key = "autosave_seconds"
type = "int"
label_key = "settings.autosave_seconds.label"
description_key = "settings.autosave_seconds.description"
default = 5
min = 0
max = 300

[[panel]]
id = "panel"
entry = "panel.luau"
width = 960
height = 620
placement = "floating"
position = "auto"
open_near_click = true

[[widget]]
id = "nnotes"
entry = "nnotes.luau"

  # Frees middle click for onMiddleClick; settings open from the panel's gear.
  [widget.actions]
  middle = "none"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "notes"
